data:
  train_dir: data/glomerulo/train
  test_dir: data/glomerulo/test-retrieval
  class_mapping: {Crescent: 0, Hypercellularity: 1, Membranous: 2, Normal: 3, 
      Podocytopathy: 4, Sclerosis: 5}
  batch_size_train: 64
  batch_size_eval: 64
  num_workers: 3
  suffle_train: true
  suffle_test: false
transform:
  train:
    resize: [224, 224]
    horizontal_flip: true
    color_jitter:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
      probability: 0.4
      gaussian_noise:
        var_limit: [5.0, 30.0]
        mean: 0.0
        probability: 0.4
      gaussian_blur:
        blur_limit: [3, 7]
        probability: 0.4
    random_grayscale: 0.2
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    to_tensor: true
  test:
    resize: [224, 224]
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    to_tensor: true
model:
  model_code: liu_dsh
  model_name: liu_dsh
  experiment_name: liu_dsh_glomerulo
  dataloader_type: {train: SupervisedHashingDataset, test: 
      SupervisedHashingDataset}
  pretrained: true
  load_checkpoint: false
  checkpoint_path: ''
  freeze_params: true
  backbone: {type: resnet, model_name: resnet50, freeze_params: true}
  code_size: 32
  margin: 5.0
  alpha: 0.01
optimizer: {name: adam, lr: '3e-4', weight_decay: '1e-4'}
loss: {name: supervised_hashing, margin: 5.0, alpha: 0.01}
training:
  pipeline: supervised_hashing_trainer
  epochs: 1
  early_stopping_patience: 1
  val_retrieval: {n_db_images: 10, n_query_images: 5, seed: 42}
evaluation:
  enabled: true
  pipeline: retrieval_evaluator
  load_embeddings: false
  embeddings_path: ''
  save_embeddings: true
  normalize_embeddings: false
  list_of_metrics:
  - type: map@k
    k_values: [1, 3, 5]
    similarity_type: similarity
    similarity_fn: cosine
logging: {log_file: ./logs.txt, log_level: INFO}
metric_logging: {tool: txt}
output: {results_dir: ./local_experiments/liu_dsh/glomerulo}
