data:
  dataset_type: PrecomputedEmbeddingDataset
  train_npz_path: ./local_experiments/<model_code>/glomerulus/embeddings_train.npz
  test_npz_path: ./local_experiments/<model_code>/glomerulus/embeddings_test.npz
  class_mapping: {Crescent: 0, Hypercelularidade: 1, Membranous: 2, Normal: 3, Podocitopatia: 4, Sclerosis: 5}
  batch_size_train: 32
  batch_size_eval: 64
  num_workers: 0  # Number of workers to load the data

  shuffle_train: true  # Shuffle the training data
  shuffle_test: false # Shuffle the test data
  shuffle_seed: 2025

  semantic_attributes: true
  
transform:
#  train:
#    resize: [224, 244]
#    to_tensor: true
#  test:
#    resize: [224, 224]
#    to_tensor: true
  train:
    resize: [224, 224]
    # horizontal_flip: true
    # color_jitter:
    #   brightness: 0.4
    #   contrast: 0.4
    #   saturation: 0.4
    #   hue: 0.1
    #   probability: 0.4
    #   gaussian_noise:
    #     var_limit: [5.0, 30.0]
    #     mean: 0.0
    #     probability: 0.4
    #   gaussian_blur:
    #     blur_limit: [3, 7]
    #     probability: 0.4
    # random_grayscale: 0.2
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    to_tensor: true
  test:
    resize: [224, 224]
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    to_tensor: true

model:
  num_classes: 6