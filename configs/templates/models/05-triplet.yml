model:
  model_code: <model_code>
  model_name: <model_name>
  experiment_name: <model_code>_<dataset_name>
  dataloader_type:
    train: TripletDataset
    test: TripletDataset
  pretrained: true
  load_checkpoint: false
  checkpoint_path: ''
  freeze_params: true
  hidden_dim: 2048
  out_dim: 1024
  temperature: 0.07

optimizer:
  name: adam
  lr: 1e-3
  weight_decay: 1e-4

loss:
  name: "adaptative_triplet"
  temperature: 0.07
