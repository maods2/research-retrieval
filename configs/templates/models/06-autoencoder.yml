model:
  model_code: <model_code>
  model_name: <model_name>
  experiment_name: <model_code>_<dataset_name>
  dataloader_type:
    train: StandardImageDataset
    test: StandardImageDataset
  pretrained: true
  load_checkpoint: false
  checkpoint_path: ''
  freeze_params: true
  encoder_dim: 2048  # Dimension of the encoder output.
  decoder_channels: 2048 #  Number of channels in the decoder output
  decoder_h: 8 # Height of the decoder output feature map.
  decoder_w: 8 # Width of the decoder output feature map.

optimizer:
  name: adam
  lr: 1e-3
  weight_decay: 1e-4

loss:
  name: "mse"
