model:
  model_code: <model_code>
  model_name: <model_name>
  experiment_name: <model_code>_<dataset_name>
  dataloader_type:
    train: ContrastiveDataset
    test: ContrastiveDataset
  pretrained: true
  load_checkpoint: false
  checkpoint_path: ''
  freeze_params: true
  backbone:
    type: resnet
    model_name: resnet18
    freeze_params: true
  hidden_dim: 512
  out_dim: 128
  temperature: 0.07

optimizer:
  name: adam
  lr: 1e-3
  weight_decay: 1e-4

loss:
  name: "supervised_contrastive"
  temperature: 0.07
