model:
  model_code: <model_code>
  model_name: <model_name>
  experiment_name: <model_code>_<dataset_name>
  pretrained: true
  load_checkpoint: false
  checkpoint_path: ''
  freeze_params: false
  encoder_dim: 512
  projection_dim: 128
  temperature: 0.07

optimizer:
  name: adam
  lr: 1e-3
  weight_decay: 1e-4

loss:
  name: "supcon"
  temperature: 0.07
