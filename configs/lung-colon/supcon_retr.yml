data:
  train_dir: data/lung-colon/train
  test_dir: data/lung-colon/test-retrieval
  class_mapping: {colon_aca: 0, colon_n: 1, lung_aca: 2, lung_n: 3, lung_scc: 4}
  batch_size_train: 64
  batch_size_eval: 64
  num_workers: 3
  suffle_train: true
  suffle_test: false
model:
  num_classes: 5
  model_code: supcon
  model_name: resnet50
  experiment_name: supcon_lung-colon
  dataloader_type: {train: ContrastiveDataset, test: ContrastiveDataset}
  pretrained: true
  load_checkpoint: true
  checkpoint_path: './local_experiments/lung-colon/supcon/supcon_lung-colon_2025-10-26_16-30-48/supcon_lung-colon_default_model_2025-10-26_16-31-57_checkpoint.pth'
  freeze_params: true
  backbone: {type: resnet, model_name: resnet50, freeze_params: true}
  hidden_dim: 512
  out_dim: 128
  temperature: 0.07
transform:
  test:
    resize: [224, 224]
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    to_tensor: true
optimizer: {name: adam, lr: '1e-3', weight_decay: '1e-4'}
loss: {name: supervised_contrastive, temperature: 0.07}
training:
  pipeline: supcon_trainer
  epochs: 100
  early_stopping_patience: 100
  val_retrieval: {n_db_images: 100, n_query_images: 5, seed: 42}
evaluation:
  enabled: true
  pipeline: retrieval_evaluator
  load_embeddings: false
  embeddings_path: ''
  save_embeddings: true
  normalize_embeddings: false
  list_of_metrics:
  - type: map@k
    k_values: [1, 3, 6, 9, 12, 15]
    similarity_type: similarity
    similarity_fn: cosine
logging: {log_file: ./logs.txt, log_level: INFO}
metric_logging: {tool: txt}
output: {results_dir: ./local_experiments/lung-colon/supcon}
